name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: lukka/get-cmake@latest
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64
          cmake --build build-x64 --config Release
      - name: Build x86
        run: |
          cmake -S . -B build-x86 -A Win32
          cmake --build build-x86 --config Release
      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\x64,dist\x86 | Out-Null
          Copy-Item build-x64\Release\GameAudioBridgeHook.dll dist\x64\
          Copy-Item build-x64\Release\GameAudioBridgeLauncher.exe dist\x64\
          Copy-Item build-x86\Release\GameAudioBridgeHook.dll dist\x86\
          Copy-Item build-x86\Release\GameAudioBridgeLauncher.exe dist\x86\
          Copy-Item README.md dist\README.txt
          Copy-Item installer\Launch-Bridge.ps1 dist\Launch-Bridge.ps1
      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\GameAudioBridge.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: GameAudioBridge-Setup
          path: Output/GameAudioBridge-Setup.exe
